name: dashboard-feed

# BTC Dashboard inputs that browsers cannot fetch reliably: news headlines (RSS),
# Fear & Greed, company treasuries, daily volume, exchange flows, Lightning stats.
# Runs every 15 minutes; commits data/dash.json only when its content changed.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch feeds
        run: node agent/feed.mjs
      - name: Commit if changed
        run: |
          git config user.name "btcintel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dash.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "dashboard-feed: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
