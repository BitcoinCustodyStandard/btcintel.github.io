name: probe-sources
# Temporary: checks candidate free sources from Actions. Will be removed.
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cat > p.mjs <<'JS'
          const get = async (u, n = 600) => { try { const r = await fetch(u, { headers: { 'user-agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36', accept: 'application/json, text/html;q=0.9, */*;q=0.8' }, signal: AbortSignal.timeout(20000) }); const t = await r.text(); console.log(`\n### ${r.status} ${u}\nlen=${t.length} type=${r.headers.get('content-type')} acao=${r.headers.get('access-control-allow-origin')}\n${t.slice(0, n).replace(/\s+/g, ' ')}`); return t; } catch (e) { console.log(`\n### ERR ${u} ${e.message}`); return ''; } };
          // Polymarket discovery
          const ev = await get('https://gamma-api.polymarket.com/events?tag_slug=bitcoin&active=true&closed=false&limit=40&order=volume24hr&ascending=false', 300);
          try { const j = JSON.parse(ev); for (const e of j.slice(0, 25)) console.log('EVENT', e.slug, '|', e.title, '| vol24', Math.round(e.volume24hr || 0), '| markets', e.markets?.length, '| end', e.endDate); const m = j[0]?.markets?.[0]; console.log('MARKET KEYS', m && Object.keys(m).join(',')); console.log('MARKET SAMPLE', JSON.stringify(m && { q: m.question, op: m.outcomePrices, o: m.outcomes, v24: m.volume24hr, v: m.volume, ch: m.oneDayPriceChange, slug: m.slug, tok: m.clobTokenIds, last: m.lastTradePrice, bid: m.bestBid, ask: m.bestAsk, end: m.endDate, git: m.groupItemTitle })); } catch (e) { console.log('parse', e.message); }
          await get('https://gamma-api.polymarket.com/public-search?q=bitcoin%20price&limit_per_type=10', 500);
          // intraday candles
          await get('https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=60', 200);
          await get('https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=60', 200);
          // distribution candidates
          const bic = await get('https://bitinfocharts.com/top-100-richest-bitcoin-addresses.html', 200);
          const i = bic.indexOf('Bitcoin distribution'); console.log('BIC distribution idx', i, i > 0 ? bic.slice(i, i + 3000).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ') : '');
          for (const m of ['AdrBalNtv0.001Cnt', 'AdrBalNtv0.01Cnt', 'AdrBalNtv0.1Cnt', 'AdrBalNtv1Cnt', 'AdrBalNtv10Cnt', 'AdrBalNtv100Cnt', 'AdrBalNtv1KCnt', 'AdrBalNtv10KCnt', 'AdrBalNtv100KCnt', 'SplyAdrBalNtv1', 'SplyAdrBalNtv10K'])
            await get(`https://community-api.coinmetrics.io/v4/timeseries/asset-metrics?assets=btc&metrics=${m}&frequency=1d&page_size=1&paging_from=end`, 200);
          await get('https://bitcoin-data.com/', 300);
          await get('https://bitcoin-data.com/api/swagger-ui/index.html', 200);
          await get('https://bitcoin-data.com/v3/api-docs/public', 200);
          await get('https://bitcoin-data.com/api/v3/api-docs', 400);
          // Yahoo for correlation history
          await get('https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=2y&interval=1d', 200);
          JS
          node p.mjs
