name: probe-sources
# Temporary: looks for a free full-history source of per-fund ETF flows. Will be removed.
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cat > p.mjs <<'JS'
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';
          const get = async (u, n = 400) => { try { const r = await fetch(u, { headers: { 'user-agent': UA, accept: 'text/html,application/json' }, signal: AbortSignal.timeout(20000) }); const t = await r.text(); console.log(`\n### ${r.status} ${u} len=${t.length}`); return t; } catch (e) { console.log(`\n### ERR ${u} ${e.message}`); return ''; } };
          const h = await get('https://bitbo.io/treasuries/etf-flows/');
          console.log('IBIT count', (h.match(/IBIT/g) || []).length, '| next_data', h.includes('__NEXT_DATA__'), '| next_f', h.includes('self.__next_f'), '| scripts', (h.match(/<script/g) || []).length);
          for (const k of ['"date"', 'date:', '"IBIT"', 'IBIT:', '2024-01-11', '2024-01-12', 'Jan 11, 2024', '1704931200']) { const i = h.indexOf(k); console.log('KEY', k, i, i >= 0 ? h.slice(Math.max(0, i - 120), i + 260).replace(/\s+/g, ' ') : ''); }
          const big = [...h.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)].map((m) => m[1]).sort((a, b) => b.length - a.length).slice(0, 3);
          for (const b of big) console.log('SCRIPT len', b.length, b.slice(0, 300).replace(/\s+/g, ' '));
          JS
          node p.mjs
