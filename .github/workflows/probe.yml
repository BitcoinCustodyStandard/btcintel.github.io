name: probe-sources
# Temporary: checks candidate free sources from Actions. Will be removed.
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cat > p.mjs <<'JS'
          const get = async (u, n = 600) => { try { const r = await fetch(u, { headers: { 'user-agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36', accept: 'application/json, text/html;q=0.9, */*;q=0.8' }, signal: AbortSignal.timeout(20000) }); const t = await r.text(); console.log(`\n### ${r.status} ${u}\nlen=${t.length} type=${r.headers.get('content-type')} acao=${r.headers.get('access-control-allow-origin')}\n${t.slice(0, n).replace(/\s+/g, ' ')}`); return t; } catch (e) { console.log(`\n### ERR ${u} ${e.message}`); return ''; } };
          const bic = await get('https://bitinfocharts.com/top-100-richest-bitcoin-addresses.html', 50);
          const k = bic.indexOf('Balance, BTC'); console.log('BIC TABLE', k, bic.slice(Math.max(0, k - 400), k + 4500));
          const spec = await get('https://bitcoin-data.com/api/v3/api-docs', 50);
          try { const j = JSON.parse(spec); const ps = Object.entries(j.paths); console.log('BGEO N PATHS', ps.length); for (const [p, v] of ps) if (/shrimp|crab|fish|shark|whale|humpback|cohort|balance|distribution|addresses/i.test(p)) console.log('BGEO', p, '|', (v.get?.summary || v.get?.description || '').slice(0, 120)); } catch (e) { console.log('spec parse', e.message); }
          for (const s of ['%5Espx', 'xauusd', 'gc.f', 'dx.f', 'btcusd'])
            await get(`https://stooq.com/q/d/l/?s=${s}&i=d`, 160);
          await get('https://query2.finance.yahoo.com/v8/finance/chart/GC%3DF?range=2y&interval=1d', 120);
          const ev = await get('https://gamma-api.polymarket.com/events?slug=what-price-will-bitcoin-hit-before-2027', 50);
          try { const e = JSON.parse(ev)[0]; for (const m of e.markets.filter((m) => m.active && !m.closed).slice(0, 50)) console.log('M', m.groupItemTitle, '|', m.question, '|', m.outcomePrices, '| v24', Math.round(m.volume24hr || 0), '| v', Math.round(m.volumeNum || 0), '| ch', m.oneDayPriceChange, '| thr', m.groupItemThreshold); } catch (e) { console.log(e.message); }
          const mo = await get('https://gamma-api.polymarket.com/events?tag_slug=bitcoin&active=true&closed=false&limit=100', 50);
          try { for (const e of JSON.parse(mo)) if (/month|october|november|december|2026|end of/i.test(e.title) && !/up or down|on october \d/i.test(e.title)) console.log('EV', e.slug, '|', e.title, '| v', Math.round(e.volume || 0), '| end', e.endDate); } catch (e) { console.log(e.message); }
          JS
          node p.mjs
