name: probe-site
# Temporary: loads btcintel.org in a real browser and reports card states. Will be removed.
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          cat > p.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const page = await b.newPage({ viewport: { width: 1440, height: 900 } });
          const log = [];
          page.on('console', (m) => log.push(`console.${m.type()}: ${m.text()}`));
          page.on('pageerror', (e) => log.push('PAGEERROR ' + e.message));
          page.on('requestfailed', (r) => log.push(`FAILED ${r.url()} ${r.failure()?.errorText}`));
          page.on('response', (r) => { if (r.status() >= 400) log.push(`HTTP ${r.status()} ${r.url()}`); });
          await page.goto('https://btcintel.org/?v=' + Date.now(), { waitUntil: 'load' });
          await page.waitForTimeout(25000);
          const cards = await page.$$eval('.mcard', (els) => els.map((e) => `${e.dataset.k} | ${e.querySelector('.mc-v').textContent.trim()} | ${e.querySelector('.mc-m').textContent.trim()}`));
          console.log(cards.join('\n'));
          console.log('--- hero:', await page.$eval('#dh-stats', (e) => e.textContent).catch(() => 'none'));
          console.log('--- clock:', await page.$eval('#bc-s', (e) => e.textContent).catch(() => 'none'));
          console.log('--- log\n' + log.join('\n'));
          await b.close();
          JS
          node p.mjs
