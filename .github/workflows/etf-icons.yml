name: etf-icons
# One-off: download issuer icons for the ETF table into assets/etf/. Will be removed.
on:
  push:
    paths: ['.github/workflows/etf-icons.yml']
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets/etf
          while read -r sym domain; do
            ok=""
            for url in "https://www.google.com/s2/favicons?domain=${domain}&sz=64" "https://icons.duckduckgo.com/ip3/${domain}.ico"; do
              if curl -fsSL -A "Mozilla/5.0" -o "assets/etf/${sym}.tmp" "$url" && [ "$(stat -c%s "assets/etf/${sym}.tmp")" -gt 200 ]; then ok="$url"; break; fi
            done
            if [ -n "$ok" ]; then mv "assets/etf/${sym}.tmp" "assets/etf/${sym}.png"; echo "$sym $domain $(stat -c%s assets/etf/${sym}.png) bytes $(file -b assets/etf/${sym}.png | cut -c1-40) <- $ok"; else rm -f "assets/etf/${sym}.tmp"; echo "$sym $domain FAILED"; fi
          done <<'LIST'
          ibit ishares.com
          fbtc fidelity.com
          gbtc grayscale.com
          btc grayscale.com
          bitb bitwiseinvestments.com
          arkb ark-invest.com
          hodl vaneck.com
          brrr coinshares.com
          ezbc franklintempleton.com
          btco invesco.com
          btcw wisdomtree.com
          msbt morganstanley.com
          defi hashdex.com
          LIST
          git config user.name "btcintel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/etf
          git diff --cached --quiet && exit 0
          git commit -m "ETF issuer icons (Google favicon service, 64px)"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((2 ** i)); done
