<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTCIntel</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a1220">
<style>
  :root { color-scheme: dark; --bg: #0a1220; --text: #e8edf5; --muted: #8392a9; --accent: #f5a54a; }
  @media (prefers-color-scheme: light) { :root:not([data-theme='dark']) { color-scheme: light; --bg: #f6f6f3; --text: #0d1a2d; --muted: #56647a; --accent: #a85a00; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  main { text-align: center; }
  h1 { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Market Battlefield</h1>
  <p>Coming soon.</p>
  <a href="../">← Back to BTC Intel</a>
</main>
<script type="module">
  // Browser tab: "$123,456 | BTCIntel", same live price feed as the main site.
  import { startLivePrice } from '../assets/live.js?v=20261004c';
  let live = false;
  const set = (p) => { if (Number.isFinite(p) && p > 0) document.title = `$${Math.round(p).toLocaleString('en-US')} | BTCIntel`; };
  fetch('../data/latest.json', { cache: 'no-store' }).then((r) => r.json()).then((a) => { if (!live) set(a?.metrics?.price?.spot); }).catch(() => {});
  startLivePrice({ onPrice: (v) => { live = true; set(v.price); }, onState: () => {} });
</script>
<!-- GoatCounter (privacy-friendly, no cookies). Shares the bcs.goatcounter.com account;
     every path is prefixed "btcintel.org" so this site's traffic stays separate there.
     Hash routes (#analysis/…, #reports…) are counted as their own page views. -->
<script>
  window.gcCount = function () {
    var gc = window.goatcounter; if (!gc || !gc.count) return;
    var p = 'btcintel.org' + location.pathname + (location.hash || '');
    if (p === window.gcLast) return; window.gcLast = p;
    gc.count({ path: p, title: document.title });
  };
  window.addEventListener('hashchange', function () { setTimeout(window.gcCount, 300); });
</script>
<script data-goatcounter="https://bcs.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}' async src="//gc.zgo.at/count.js" onload="window.gcCount()"></script>
</body>
</html>
